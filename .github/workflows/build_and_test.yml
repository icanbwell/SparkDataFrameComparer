name: Build and Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Create directory and set permissions
        run: |
          sudo mkdir -p /home/runner/work/${{ github.repository }}
          sudo chown -R runner:runner /home/runner/work/${{ github.repository }}
          sudo chmod 777 /home/runner/work/${{ github.repository }}

      - name: Create reports output folder
        run: mkdir -p /home/runner/work/${{ github.repository }}/reports

      # Checks-out your repository
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The helix.spark base image lives in the private services-account ECR
      # (CIE-8032), so docker must authenticate before any build. This repo is PUBLIC
      # and runs on GitHub-hosted runners, so it has no ambient AWS identity the way
      # helix.pipelines does (that relies on its self-hosted runner's IRSA role).
      # We therefore use a dedicated read-only IAM user's access key, matching the
      # pattern helix.pipelines already uses for the dev account.
      #
      # PREREQUISITE: the SERVICES_ECR_ACCESS_KEY_ID / SERVICES_ECR_SECRET_ACCESS_KEY
      # org secrets must be scoped to this repo. Fork pull requests receive no secrets,
      # so external-contributor PRs cannot build these images.
      - name: AWS Credentials (services account, for private ECR base images)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.SERVICES_ECR_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SERVICES_ECR_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR (services)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          skip-logout: true

      - name: pre-commit
        run: make run-pre-commit

      # setup and install everything and run tests
      # https://docs.pytest.org/en/8.2.x/reference/reference.html#confval-junit_logging
      - name: up
        run: make up
      - name: tests
        run: |
          docker compose run --rm --name sdc_tests \
            -v /home/runner/work/${{ github.repository }}/reports:/reports \
            dev \
            pytest \
            -o junit_logging=all -o junit_log_passing_tests=false \
            --tb=long \
            --durations=10 \
            --junitxml=/reports/pytest_report.xml > /home/runner/work/${{ github.repository }}/reports/pytest_output.log

      - name: list pytest report
        if: ${{ always() }}
        run: |
          ls -la /home/runner/work/${{ github.repository }}/reports
          cat /home/runner/work/${{ github.repository }}/reports/pytest_report.xml

      - name: Upload test output
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /home/runner/work/${{ github.repository }}/reports/pytest_output.log

      - name: Upload test report
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: /home/runner/work/${{ github.repository }}/reports/pytest_report.xml

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@fdc7f18d9934e38aca411ca9557e6577bd25ca9c # v0.9.0 https://github.com/pmeier/pytest-results-action
        with:
          # A list of JUnit XML files, directories containing the former, and wildcard
          # patterns to process.
          # See @actions/glob for supported patterns.
          path: /home/runner/work/${{ github.repository }}/reports/*.xml

          # (Optional) Add a summary of the results at the top of the report
          summary: true

          # (Optional) Select which results should be included in the report.
          # Follows the same syntax as `pytest -r`
          display-options: fEX

          # (Optional) Fail the workflow if no JUnit XML was found.
          fail-on-empty: true

          # (Optional) Title of the test results section in the workflow summary
          title: Test results

      - name: Publish test results
        uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc  # v1 https://github.com/dorny/test-reporter
        if: ${{ always() }}
        with:
          name: Pytest Summary
          path: /home/runner/work/${{ github.repository }}/reports/pytest_report.xml
          reporter: java-junit        # Format of test results
          fail-on-error: false        # Do not change the build status if errors are found
          list-tests: 'failed'       # List failed tests in the summary
